---
layout: default
title: Page Title
---
<section 
  class="page-section" 
  aria-labelledby="page-title"
  id="{{ page.title | slugify }}"
>
  <div class="page-title-group">
    <h2 id="page-title">{{ page.title }}</h2>
    {% if page.subtitle %}
      <p class="subtitle" aria-describedby="page-title">{{ page.subtitle }}</p>
    {% endif %}
  </div>
  <div class="page-content">
    {{ content }}
  </div>
</section>
