# Jekyll site config
name: MAY Lab
baseurl: "/maylab-website"
url: "https://ntumaylab.github.io"
markdown: kramdown
sass:
  sass_dir: assets/_sass
  style: compressed


plugins:
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 10
  permalink: '/news/page:num'
  title: ':title – page :num'
  sort_field: 'date'
  sort_reverse: true
  category: news
